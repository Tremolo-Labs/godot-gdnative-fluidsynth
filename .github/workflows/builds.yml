name: Build GDExtension
on:
  workflow_call:
  push:
  pull_request:
  merge_group:

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target:
          [
            { platform: linux, arch: x86_64, os: ubuntu-22.04 },
            { platform: linux, arch: x86_32, os: ubuntu-22.04 },
            { platform: linux, arch: arm64, os: ubuntu-22.04-arm },
            { platform: linux, arch: arm32, os: ubuntu-22.04-arm },
            { platform: windows, arch: x86_64, os: windows-latest },
            { platform: windows, arch: x86_32, os: windows-latest },
            { platform: macos, arch: universal, os: macos-latest },
          ]
        target-type: [template_debug, template_release]
        # Single precision only - godot-cpp extension_api.json is single-precision
        # See: https://github.com/godotengine/godot-cpp/issues/1729
        float-precision: [single]

    runs-on: ${{ matrix.target.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      # === LINUX: Use apt ===
      - name: Linux - Install fluidsynth
        if: ${{ matrix.target.platform == 'linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libfluidsynth-dev pkg-config

      - name: Linux - Install multilib support
        if: ${{ matrix.target.platform == 'linux' && matrix.target.arch == 'x86_32' }}
        run: |
          sudo apt-get install -y gcc-multilib g++-multilib

      # === WINDOWS/MACOS: Use vcpkg ===
      - name: Export GitHub Actions cache variables
        if: ${{ matrix.target.platform == 'windows' || matrix.target.platform == 'macos' }}
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Windows/macOS - Setup vcpkg
        if: ${{ matrix.target.platform == 'windows' || matrix.target.platform == 'macos' }}
        uses: lukka/run-vcpkg@v11

      - name: Windows - Install fluidsynth (x86_64)
        if: ${{ matrix.target.platform == 'windows' && matrix.target.arch == 'x86_64' }}
        run: |
          vcpkg install fluidsynth:x64-windows-static

      - name: Windows - Install fluidsynth (x86_32)
        if: ${{ matrix.target.platform == 'windows' && matrix.target.arch == 'x86_32' }}
        run: |
          vcpkg install fluidsynth:x86-windows-static

      - name: macOS - Install fluidsynth
        if: ${{ matrix.target.platform == 'macos' }}
        run: |
          vcpkg install fluidsynth:arm64-osx fluidsynth:x64-osx

      # === BUILD ===
      - name: Setup godot-cpp
        uses: ./godot-cpp/.github/actions/setup-godot-cpp
        with:
          platform: ${{ matrix.target.platform }}

      - name: Restore .scons_cache
        uses: ./godot-cpp/.github/actions/godot-cache-restore
        with:
          scons-cache: ${{ github.workspace }}/.scons-cache/
          cache-name: ${{ matrix.target.platform }}_${{ matrix.target.arch }}_${{ matrix.float-precision }}_${{ matrix.target-type }}

      - name: Build GDExtension (Linux)
        if: ${{ matrix.target.platform == 'linux' }}
        shell: sh
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons-cache/
        run: |
          scons target=${{ matrix.target-type }} platform=${{ matrix.target.platform }} arch=${{ matrix.target.arch }} precision=${{ matrix.float-precision }}

      - name: Build GDExtension (Windows/macOS)
        if: ${{ matrix.target.platform == 'windows' || matrix.target.platform == 'macos' }}
        shell: sh
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons-cache/
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          scons target=${{ matrix.target-type }} platform=${{ matrix.target.platform }} arch=${{ matrix.target.arch }} precision=${{ matrix.float-precision }}

      - name: Save .scons_cache
        uses: ./godot-cpp/.github/actions/godot-cache-save
        with:
          scons-cache: ${{ github.workspace }}/.scons-cache/
          cache-name: ${{ matrix.target.platform }}_${{ matrix.target.arch }}_${{ matrix.float-precision }}_${{ matrix.target-type }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gdmidiplayer-${{ matrix.target.platform }}-${{ matrix.target.arch }}-${{ matrix.float-precision }}-${{ matrix.target-type }}
          path: |
            ${{ github.workspace }}/bin/**

  merge:
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - name: Merge Artifacts
        uses: actions/upload-artifact/merge@v4
        with:
          name: gdmidiplayer
          pattern: gdmidiplayer-*
          delete-merged: true
